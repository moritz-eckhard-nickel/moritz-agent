# Der süße Stil von Anton auf Discord (docs/plan/14 §8.2, ADR-037): Textsmileys und Floskeln.
# Keine Emojis (Moritz, 21.10.2026) – nur Smileys wie :) :( :3 ^^ <3, höchstens einer pro Nachricht.
# Der Zucker kommt drumherum, nie in die Zahlen. Bei Warnungen, Fehlern und Admin-Sachen bleibt es sachlich.

[smiley]           # nach Skill-Gruppe (Anfang der Skill-ID); "default" für alles andere
default = [":)", ":3", "^^"]
fun = [":D", "xD"]
talk = [":3", "<3"]
holiday = [":D"]

[smiley_text]      # nach Stichwörtern im Text (hat Vorrang)
"reg(?:en|net|nen|nerisch)|schauer|nass|gewitter|unwetter" = ":("
"schnee" = ":3"
"sonnig|sonne scheint|heiter" = ":D"

[errors]           # charmant, aber klar
unavailable = "Uff, an die Daten komm ich gerade nicht ran :( Versuch’s gleich nochmal."
model_down = "Mein Sprachmodell ist gerade nicht erreichbar :( Sofortauskünfte gehen trotzdem – frag mich zum Beispiel nach dem Wetter."
starting = "Ich wache gerade erst auf ^^ Gib mir eine Minute."
generic = "Hoppla, da ist etwas schiefgegangen :( Versuch’s bitte nochmal."
rate_limited = "Nicht so schnell, ich komm kaum hinterher :3 Gleich wieder."
maintenance = "Ich werde gerade aktualisiert, gleich bin ich wieder da."
forbidden = "Mit dir darf ich leider nicht reden."
not_understood = "Das habe ich leider nicht verstanden :( Sprich nochmal etwas deutlicher?"
too_long = "Das ist mir zu lang geraten – ich hab es gekürzt."

[phrases]
thinking = ["Ein Momentchen, ich schau nach …", "Hmm, einen Augenblick …", "Ich guck mal kurz …"]
startup = ["Bin wieder wach :)", "Guude, da bin ich wieder :)", "Frisch ausgeschlafen und startklar :3"]
joined_voice = "Bin unterwegs in {channel} :)"
left_voice = "Bin wieder raus aus {channel}. Tschüss!"
saved = ["Hab ich notiert", "Gemerkt", "Erledigt"]
input_cut = "Das war ziemlich lang – ich habe nur die ersten {n} Zeichen gelesen."
thanks = ["Gern geschehen :)", "Immer wieder gern :3", "Klar doch ^^"]
