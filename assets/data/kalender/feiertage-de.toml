# Gesetzliche Feiertage in Deutschland je Bundesland (docs/plan/13-sofortauskuenfte.md §8.1).
# rule: fixed:MM-TT | easter:<Tage ab Ostersonntag> | buss (Mittwoch vor dem 23. November)
# states: "all" oder Liste der Länderkürzel. Hessen nach dem Hessischen Feiertagsgesetz
# (inkl. Oster- und Pfingstsonntag, die immer auf einen Sonntag fallen).
# Vor Inbetriebnahme gegen den amtlichen Kalender prüfen; Änderungen per PR mit Test.

[states]
BW = "Baden-Württemberg"
BY = "Bayern"
BE = "Berlin"
BB = "Brandenburg"
HB = "Bremen"
HH = "Hamburg"
HE = "Hessen"
MV = "Mecklenburg-Vorpommern"
NI = "Niedersachsen"
NW = "Nordrhein-Westfalen"
RP = "Rheinland-Pfalz"
SL = "Saarland"
SN = "Sachsen"
ST = "Sachsen-Anhalt"
SH = "Schleswig-Holstein"
TH = "Thüringen"

