# Einheiten für „Wie viel sind 5 Meilen in Kilometer?“ (docs/plan/13-sofortauskuenfte.md §6.11).
# faktor = Wert in der Basiseinheit der Kategorie (Länge: m, Masse: g, Volumen: l, Fläche: m²,
# Geschwindigkeit: m/s, Zeit: s, Daten: Byte, Energie: J, Leistung: W, Druck: Pa).
# Temperatur: Basis ist Kelvin, basis = (wert + offset) * faktor.
# "Pfund" ist im Deutschen 500 g (Alltagsgebrauch); das englische Pfund heißt "englisches pfund".

[kategorie.laenge]
mm = { name = "Millimeter", faktor = 0.001, alias = ["millimeter"] }
cm = { name = "Zentimeter", faktor = 0.01, alias = ["zentimeter"] }
dm = { name = "Dezimeter", faktor = 0.1 }
m = { name = "Meter", faktor = 1, alias = ["meter"] }
km = { name = "Kilometer", faktor = 1000, alias = ["kilometer"] }
zoll = { name = "Zoll", faktor = 0.0254, plural = "Zoll", alias = ["inch", "inches", "\""] }
fuss = { name = "Fuß", faktor = 0.3048, plural = "Fuß", alias = ["fuß", "foot", "feet", "ft"] }
yard = { name = "Yard", faktor = 0.9144, plural = "Yards", alias = ["yards", "yd"] }
meile = { name = "Meile", faktor = 1609.344, plural = "Meilen", alias = ["meilen", "mile", "miles", "mi"] }
seemeile = { name = "Seemeile", faktor = 1852, plural = "Seemeilen", alias = ["seemeilen", "nautische meile", "nautische meilen"] }
lichtjahr = { name = "Lichtjahr", faktor = 9.4607304725808e15, plural = "Lichtjahre", alias = ["lichtjahre"] }

[kategorie.masse]
