tonne = { name = "Tonne", faktor = 1000000, plural = "Tonnen", alias = ["tonnen"] }
pfund = { name = "Pfund", faktor = 500, plural = "Pfund", alias = ["pfd"] }
zentner = { name = "Zentner", faktor = 50000, plural = "Zentner" }
unze = { name = "Unze", faktor = 28.349523125, plural = "Unzen", alias = ["unzen", "ounce", "ounces", "oz"] }
