# Währungen der EZB-Referenzkurse mit gesprochenen Namen und Aliassen (docs/plan/13 §6.12).
# `name`: so spricht Nikita die Währung (gilt für Einzahl und Mehrzahl); `aliases`: so nennt man sie.
# `ambiguous`: Wörter, die mehrere Währungen meinen können – es folgt eine Rückfrage.

[ambiguous]
krone = ["SEK", "NOK", "DKK", "CZK"]
kronen = ["SEK", "NOK", "DKK", "CZK"]

[currencies.EUR]
name = "Euro"
aliases = ["euro", "euros", "eur", "€"]

[currencies.USD]
name = "US-Dollar"
aliases = ["dollar", "dollars", "us-dollar", "us dollar", "amerikanische dollar", "usd", "$", "buck", "bucks"]

