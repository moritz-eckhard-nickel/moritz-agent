# moritz-agent – nicht geheime Konfiguration
#
# Vorlage für config/moritz-agent.toml (lokal, nicht versioniert).
# Zugangsdaten (SIP, Web-Login, SSH) stehen AUSSCHLIESSLICH in passwords.txt.
# Jeder Schlüssel ist hier mit seinem Default dokumentiert (Anforderung CFG-08).

[general]
timezone = "Europe/Berlin"        # Zeitzone für get_current_time und Logs
language = "de"                   # Sprache für STT, TTS, Systemprompts
data_dir = "data"                 # relativ zum Installationsverzeichnis
models_dir = "models"
passwords_file = "passwords.txt"

[server]
host = "0.0.0.0"                  # aus dem LAN erreichbar (F-04); nur mit aktivem Web-Login (API-02)
port = 3501
tls = true                        # HTTPS (ADR-022); false nur für lokale Tests
tls_cert = "runtime/tls/cert.pem" # vom Installer selbst signiert erzeugt, eigenes Zertifikat möglich
tls_key = "runtime/tls/key.pem"
session_ttl_hours = 12
login_max_attempts = 5            # pro IP und Zeitfenster
login_window_minutes = 5

[logging]
level = "INFO"
file = "data/logs/moritz-agent.log"
max_bytes = 10_485_760
backup_count = 10
pjsip_log_level = 3               # > 3 kann Authorization-Header enthalten (LOG-02)

[inference]
koboldcpp_script = "koboldcpp.py" # Upstream-Einstieg, als Child-Prozess (ADR-003)
model = "models/llm/Qwen3-30B-A3B-Instruct-2507-UD-Q3_K_XL.gguf"   # ADR-016
context_size = 4096               # 8192 erst nach Messung (INF-05)
gpu_layers = 999                  # alle Schichten auf die GPU …
moe_cpu_layers = 24               # … aber Experten der ersten N Schichten im RAM (--moecpu), ≈ halb/halb
use_cuda = true
jinja = true                      # Chat-Template aus GGUF verwenden
chat_adapter = ""                 # alternativ Adapter aus kcpp_adapters/
threads = 12                      # Generierung (E5-2673 v3, LXC max. 18 Threads)
batch_threads = 12                # Prompt-Verarbeitung
websearch_fallback = true         # KoboldCpp mit --websearch starten (Such-Fallback, ADR-020)
startup_timeout_s = 180
request_timeout_s = 60
phone_preempt_wait_s = 3          # wie lange PHONE auf INTERACTIVE wartet, bevor abgebrochen wird

[search]
enabled = true
backends = ["searxng", "koboldcpp", "wikipedia"]   # Fallback-Kette in dieser Reihenfolge (ADR-020)
timeout_s = 6                     # SearXNG
fallback_timeout_s = 8            # KoboldCpp-Websuche / Wikipedia
max_results = 5
language = "de-DE"
safesearch = 0
# Engines: config/searxng/settings.yml (alle Standard-Engines + google, bing, qwant, …; F-09)

[phone]
enabled = true
assistant_name = "Nikita"         # Name, mit dem sich der Assistent vorstellt (ADR-026)
greeting_text = "Hallo Moritz, hier ist Nikita. Was kann ich für dich tun?"
local_sip_port = 5060
rtp_port_start = 40000
rtp_port_count = 200
codecs = ["G722/16000", "PCMA/8000", "PCMU/8000"]   # Reihenfolge = Priorität
allowed_source_ips = ["192.168.1.176"]                # INVITEs nur von hier (PHONE-09)
max_concurrent_calls = 1                              # zweiter Anruf → 486 Busy Here
register_retry_min_s = 5
register_retry_max_s = 300
silence_prompt_s = 10             # dann „Bist du noch da?“ (PHONE-31)
silence_hangup_s = 10             # weitere Stille danach → Abschied + Auflegen
thinking_prompt_after_s = 2.5     # Zwischenansage (PHONE-35)
turn_deadline_s = 15              # Gesamtzeit je Antwort (AGENT-04)
max_reprompts = 2                 # unverständliche Eingaben in Folge (PHONE-30)
max_call_duration_s = 1800

[phone.vad]
engine = "silero"
model = "assets/models/vad/silero_vad.onnx"   # im Repo
threshold = 0.5
min_silence_ms = 700              # Sprachende-Erkennung
speech_pad_ms = 300
max_utterance_s = 20

[phone.stt]
engine = "faster-whisper"         # ADR-006 (entschieden)
model = "models/stt/faster-whisper-small"   # Whisper small, CPU
compute_type = "int8"
beam_size = 1
cpu_threads = 8
no_speech_threshold = 0.6
min_avg_logprob = -1.0

[phone.tts]
engine = "polly"                  # Wunschstimme Hans (Amazon Polly, docs/stimme-hans.md) | "piper" = lokal (ADR-008)
fallback_engine = "piper"         # bei fehlenden AWS-Schlüsseln, Polly-Fehler, Timeout, offline
cpu_threads = 4

[phone.tts.piper]
voice = "models/tts/de_DE-thorsten-medium.onnx"
length_scale = 1.0                # < 1 schneller, > 1 langsamer
sentence_silence_s = 0.15

[phone.tts.polly]
voice = "Hans"                    # Wunschstimme Moritz (F-08)
engine = "standard"
sample_rate = 16000               # PCM direkt im Telefonformat
timeout_s = 1.5
# Zugangsdaten: passwords.txt [optional_services] aws_polly_access_key_id / aws_polly_secret_access_key / aws_polly_region

[agent.phone]
max_tool_steps = 3
max_answer_tokens = 160
temperature = 0.3
tools = ["get_current_time", "web_search"]   # PHONE-45: keine Shell/SSH
system_prompt_file = "moritz_agent/agent/prompts/phone.de.md"

[storage]
database = "data/moritz-agent.sqlite3"
store_transcripts = true          # F-03: Text ja …
transcript_retention_hours = 24   # … aber nur 24 Stunden

[fastpaths]
enabled = true                    # F-13, Katalog docs/plan/12-fast-paths.md
state = "HE"                      # Bundesland für Feiertage: Hessen (F-15)

[sandbox]
# Verbindungsdaten in passwords.txt [sandbox_ssh]; Nutzung ab Part 4.
connect_timeout_s = 10
