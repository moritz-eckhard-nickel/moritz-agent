# SearXNG settings for the internal moritz-agent search worker (ADR-007, ADR-020).
# Source: vendored checkout in third_party/searxng (see third_party/VENDORED.md).
# secret_key is generated at install time and passed via SEARXNG_SECRET – never commit it.
use_default_settings: true

general:
  instance_name: "m-agent-search"
  enable_metrics: false

server:
  bind_address: "127.0.0.1"   # port is assigned dynamically by the supervisor
  limiter: false               # single internal client, no public access
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  default_lang: "de-DE"
  formats:
    - html
    - json                     # required for the agent client

ui:
  static_use_hash: true

# F-09: all engines. We keep every engine SearXNG enables by default (duckduckgo, brave,
# yahoo, wikipedia, wikidata, bing news, google news, reuters, ...) and additionally enable
# the general web/news engines that are off by default because they tend to rate-limit.
# Blocked engines are suspended automatically; the agent only names an engine as a source
# if it actually delivered the result (SEARCH-02).
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: qwant news
    disabled: false
  - name: tagesschau
    disabled: false
  - name: fireball news
    disabled: false
