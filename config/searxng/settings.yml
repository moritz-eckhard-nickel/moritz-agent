# SearXNG settings for the internal moritz-agent search worker (ADR-007).
# secret_key is generated at install time into data/searxng/settings.local.yml – never commit it.
use_default_settings: true

general:
  instance_name: "moritz-agent-search"
  enable_metrics: false

server:
  bind_address: "127.0.0.1"   # port is assigned dynamically by the supervisor
  limiter: false               # single internal client, no public access
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  default_lang: "de-DE"
  formats:
    - html
    - json                     # required for the agent client

ui:
  static_use_hash: true

# Engine selection is finalized in P1-08. Engines that get blocked are suspended by SearXNG.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: qwant
    disabled: false
