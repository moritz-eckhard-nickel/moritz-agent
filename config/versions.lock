# SPDX-License-Identifier: LicenseRef-MSOL-1.1
# moritz-agent – pinned external components (read by installer and updater)
# Format: TOML. See docs/plan/07-installation-update.md §5 and ADR-021.
# "vendored" = lives in this repository; no download needed.
# sha256 = "tofu" → computed on first download, stored in data/state/model-hashes.json and
# enforced on every later download (huggingface.co was not reachable when this PR was built).

[koboldcpp]
upstream_version = "1.123.1"
build = "source"                  # ADR-015: ./koboldcpp.sh rebuild

[pjproject]
version = "2.17"
commit = "5a457451fa2712ba18e12b01738e8ff3af2b26fd"
vendored = "third_party/pjproject"

[searxng]
commit = "8252c0bf6d5d97e833868099272eed0bb75828b2"   # 2026-10-16
vendored = "third_party/searxng"

[python]
# Python packages come from PyPI at install time, pinned with SHA-256 hashes (ADR-019).
locks = ["requirements/core.lock", "requirements/phone.lock", "requirements/polly.lock", "requirements/searxng.lock"]

[models.vad]
name = "silero_vad"
version = "v6.2.3"
vendored = "assets/models/vad/silero_vad.onnx"
sha256 = "1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3"
size_bytes = 2327524

[models.llm]
repo = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
file = "Qwen3-30B-A3B-Instruct-2507-UD-Q3_K_XL.gguf"
url = "https://huggingface.co/unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF/resolve/main/Qwen3-30B-A3B-Instruct-2507-UD-Q3_K_XL.gguf"
target = "models/llm/Qwen3-30B-A3B-Instruct-2507-UD-Q3_K_XL.gguf"
size_bytes = 13833048480
sha256 = "tofu"
license = "Apache-2.0"

[models.stt]
repo = "Systran/faster-whisper-small"
target_dir = "models/stt/faster-whisper-small"
files = [
    { name = "model.bin", size_bytes = 483546902 },
    { name = "config.json", size_bytes = 2370 },
    { name = "tokenizer.json", size_bytes = 2203239 },
    { name = "vocabulary.txt", size_bytes = 459861 },
]
url_template = "https://huggingface.co/Systran/faster-whisper-small/resolve/main/{name}"
sha256 = "tofu"
license = "MIT"

[models.tts_voice]
name = "de_DE-thorsten-medium"
target_dir = "models/tts"
files = [
    { name = "de_DE-thorsten-medium.onnx", size_bytes = 63201294 },
    { name = "de_DE-thorsten-medium.onnx.json", size_bytes = 4819 },
]
url_template = "https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/medium/{name}"
sha256 = "tofu"
license = "CC0-1.0 (dataset Thorsten-Voice)"
