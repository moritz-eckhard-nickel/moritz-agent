<!doctype html>

<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moritz-agent – Status</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <img class="logo" src="/branding/m-agent-logo-64.png" width="40" height="40" alt="m-agent">
    <h1>moritz-agent <span class="muted">Nikita</span></h1>
    <button id="logout" class="ghost" hidden>Abmelden</button>
  </header>

  <main>
    <section id="login-view" hidden>
      <picture class="mascot">
        <source srcset="/branding/scribbles/scribbles-white.svg" media="(prefers-color-scheme: dark)">
        <img src="/branding/scribbles/scribbles-black.svg" height="120" alt="Scribbles">
      </picture>
      <h2>Anmelden</h2>
      <p id="login-hint" class="muted">Zugangsdaten stehen in der Datei passwords.txt im Abschnitt [web_login].</p>
      <form id="login-form" autocomplete="on">
        <label>Benutzername <input name="username" autocomplete="username" required></label>
        <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Anmelden</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="status-view" hidden>
      <div id="banner" class="banner" role="status">
        <picture class="mascot small">
          <source srcset="/branding/scribbles/scribbles-white.svg" media="(prefers-color-scheme: dark)">
          <img src="/branding/scribbles/scribbles-black.svg" height="64" alt="">
        </picture>
        <div>
          <strong id="banner-title">Lade …</strong>
          <div id="banner-sub" class="muted"></div>
        </div>
      </div>

      <div id="components" class="grid"></div>

      <div class="actions">
        <button id="reload">Konfiguration neu laden</button>
        <span id="reload-result" class="muted" role="status"></span>
      </div>

      <h2>Testfrage</h2>
      <form id="chat-form" class="chat">
        <input id="chat-input" maxlength="500" placeholder="Zum Beispiel: Wie spät ist es?" aria-label="Frage an Nikita" required>
        <button type="submit">Fragen</button>
      </form>
      <div id="chat-answer" class="answer" role="status"></div>
      <p class="muted small-print">Läuft durch dieselbe Verarbeitung wie das Telefon, nur ohne Sprache.</p>
    </section>

    <section id="error-view" hidden>
      <picture class="mascot">
        <source srcset="/branding/scribbles/scribbles-white.svg" media="(prefers-color-scheme: dark)">
        <img src="/branding/scribbles/scribbles-black.svg" height="120" alt="Scribbles">
      </picture>
      <h2 id="error-title">Das hat nicht geklappt</h2>
      <p id="error-text" class="muted"></p>
    </section>
  </main>
  <script src="/static/status.js"></script>
</body>
</html>
