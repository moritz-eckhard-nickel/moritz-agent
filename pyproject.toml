[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moritz-agent"
dynamic = ["version"]
description = "Local AI agent with internal SIP telephony, web search and tools, built on KoboldCpp."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-MSOL-1.1" }  # own code; see LICENSING.md for bundled components
# Runtime dependencies are added by the ticket that first uses them (ADR-019),
# pinned with hashes in requirements/*.lock. Planned groups:
#   core:  fastapi, uvicorn, pydantic, httpx
#   phone: faster-whisper, piper-tts, onnxruntime, soxr, numpy (+ pjsua2, built from source)
dependencies = [
    "tzdata>=2024.1",  # zoneinfo data for Europe/Berlin even without system tzdata
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
moritz-agent = "moritz_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "moritz_agent.__version__" }

[tool.setuptools.packages.find]
include = ["moritz_agent*"]

[tool.setuptools.package-data]
moritz_agent = ["agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests/moritz_agent"]
addopts = "--import-mode=importlib -m 'not network'"
pythonpath = ["."]
markers = [
    "network: needs the internet or a locally installed service (run with -m network)",
]

[tool.ruff]
# Only lint moritz-agent code; KoboldCpp upstream files are out of scope (ADR-001).
include = ["moritz_agent/**/*.py", "tests/moritz_agent/**/*.py", "scripts/**/*.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501: long lines are left to the formatter; RUF001-003: German typography uses en dashes.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as parameter defaults.
extend-immutable-calls = ["fastapi.Depends"]
