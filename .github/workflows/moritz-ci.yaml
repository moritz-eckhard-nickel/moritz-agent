name: moritz-agent CI

on:
  pull_request:
  push:
    branches: [agent]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check moritz_agent tests/moritz_agent
      - name: Ruff format
        run: ruff format --check moritz_agent tests/moritz_agent
      - name: Pytest
        run: pytest

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck moritz-agent install.sh update.sh moritz-install.sh moritz-update.sh
